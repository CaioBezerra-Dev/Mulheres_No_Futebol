<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <meta name="robots" content="noindex">
  <title>Imagem de compartilhamento · Mulheres no Futebol</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0A1F12; color: #fff; }
    .og { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; }
    .og__ceu { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6; }
    .og__arquibancada { position: absolute; top: 210px; width: 100%; height: 260px; background: url('../assets/img/cena/arquibancada-fundo-1x.webp') repeat-x center / auto 100%; }
    .og__gramado { position: absolute; top: 440px; width: 100%; height: 240px; object-fit: cover; object-position: top; }
    .og__luz { position: absolute; right: -60px; top: -70px; width: 600px; height: 800px; background: linear-gradient(125deg, rgba(244,248,241,.28), transparent 65%); clip-path: polygon(62% 0, 75% 0, 100% 100%, 0 100%); }
    .og::after { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(4,18,9,.98) 0%, rgba(4,18,9,.89) 36%, rgba(4,18,9,.25) 100%), linear-gradient(0deg, #0A1F12, transparent 35%); }
    .og__torre { position: absolute; right: 75px; top: 18px; width: 130px; height: 395px; object-fit: contain; }
    .og__objeto { position: absolute; z-index: 2; filter: drop-shadow(0 18px 16px rgba(0,0,0,.38)); }
    .og__microfone { right: 290px; top: 280px; height: 210px; transform: rotate(-9deg); }
    .og__apito { right: 142px; top: 370px; width: 170px; transform: rotate(7deg); }
    .og__caderneta { right: 25px; top: 260px; height: 195px; transform: rotate(8deg); }
    .og__texto { position: absolute; z-index: 3; left: 56px; top: 52px; max-width: 780px; }
    .og__kicker { margin: 0 0 32px; font: 650 14px/1 var(--f-ui); letter-spacing: .22em; text-transform: uppercase; color: #7BC96F; }
    .og__kicker::before { content: ''; display: inline-block; width: 28px; height: 3px; background: #FFD23F; vertical-align: middle; margin-right: 14px; }
    .og__titulo { margin: 0; max-width: 650px; font: 800 144px/.94 var(--f-titulo); font-stretch: 75%; text-transform: uppercase; letter-spacing: -.025em; text-wrap: balance; }
    .og__descricao { max-width: 530px; margin: 30px 0 0; font: italic 400 24px/1.4 'Source Serif 4', Georgia, serif; color: #D2DFD2; }
    .og__rodape { position: absolute; z-index: 3; left: 56px; right: 56px; bottom: 36px; padding-top: 22px; border-top: 1px solid rgba(244,248,241,.3); display: flex; justify-content: space-between; align-items: center; font: 500 14px/1 var(--f-ui); }
    .og__autora { font-weight: 700; }
    .og__secoes { color: #D2DFD2; }
  </style>
  <script defer src="../conteudo.js"></script>
</head>
<body>
  <!-- Renderizar este quadro em 1200 × 630, escala 1, para exportar og-image.jpg. -->
  <main class="og">
    <img class="og__ceu" src="../assets/img/cena/ceu-noturno-1x.webp" alt="">
    <div class="og__arquibancada"></div>
    <img class="og__gramado" src="../assets/img/cena/gramado-listrado-2x.webp" alt="">
    <div class="og__luz"></div>
    <img class="og__torre" src="../assets/img/cena/torre-refletor-1x.webp" alt="">
    <img class="og__objeto og__microfone" src="../assets/img/objetos/microfone-1x.webp" alt="">
    <img class="og__objeto og__apito" src="../assets/img/objetos/apito-1x.webp" alt="">
    <img class="og__objeto og__caderneta" src="../assets/img/objetos/caderneta-1x.webp" alt="">
    <div class="og__texto">
      <p class="og__kicker">Reportagem multimídia</p>
      <h1 class="og__titulo">Mulheres no Futebol</h1>
      <p class="og__descricao">Histórias de quem ocupa o campo, a cabine e a diretoria.</p>
    </div>
    <footer class="og__rodape"><span class="og__autora">Rebecca Crecci</span><span class="og__secoes">Jornalistas · Árbitras · Gestoras</span></footer>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.CONTEUDO?.site.titulo) document.querySelector('h1').textContent = window.CONTEUDO.site.titulo;
    });
  </script>
</body>
</html>
